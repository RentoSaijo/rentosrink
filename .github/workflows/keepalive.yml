name: Streamlit Wake

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check -U pip
          pip install --disable-pip-version-check playwright
          playwright install --with-deps chromium

      - name: Visit app + wake + verify app is live (<=5 min)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python - <<'PY'
          import os, sys, time
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          url = os.environ["APP_URL"].rstrip("/") + "/"
          print("Opening:", url, flush=True)

          LIVE_SELECTORS = [
              'div[data-testid="stAppViewContainer"]',
              'header[data-testid="stHeader"]',
              'div[data-testid="stToolbar"]',
          ]

          HARD_CAP_SECONDS = 5 * 60  # <= 5 minutes total
          start = time.monotonic()

          def time_left_ms(default_ms):
              left = HARD_CAP_SECONDS - (time.monotonic() - start)
              return max(1000, min(int(left * 1000), default_ms))

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              def click_wake_if_present():
                  btn = page.get_by_role("button").filter(has_text="get this app back up")
                  if btn.count() > 0:
                      print("Sleep gate detected. Clicking wake button…", flush=True)
                      btn.first.click()
                      return True
                  print("No sleep gate detected on this load.", flush=True)
                  return False

              def wait_for_live():
                  for sel in LIVE_SELECTORS:
                      try:
                          page.wait_for_selector(sel, timeout=10_000)
                          return sel
                      except PWTimeout:
                          pass
                  return None

              def save_debug(tag):
                  try:
                      page.screenshot(path=f"debug_{tag}.png", full_page=True)
                      with open(f"debug_{tag}.html", "w", encoding="utf-8") as f:
                          f.write(page.content())
                      with open(f"debug_{tag}_url.txt", "w", encoding="utf-8") as f:
                          f.write(page.url)
                      print(f"Saved debug_{tag}.*", flush=True)
                  except Exception as e:
                      print("Failed saving debug:", e, flush=True)

              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=time_left_ms(60_000))
                  print("Landed on:", page.url, flush=True)

                  attempt = 0
                  while True:
                      if time.monotonic() - start > HARD_CAP_SECONDS:
                          save_debug("timeout")
                          raise RuntimeError("Hard cap reached before app became live.")

                      attempt += 1
                      click_wake_if_present()
                      page.wait_for_timeout(2_000)

                      live_sel = wait_for_live()
                      if live_sel:
                          print(f"App is live (found {live_sel}).", flush=True)
                          print("Final URL:", page.url, flush=True)
                          # Keep open briefly to count as activity, but don't burn budget
                          page.wait_for_timeout(min(15_000, time_left_ms(15_000)))
                          print("Done.", flush=True)
                          break

                      print(f"Attempt {attempt}: not live yet; reloading…", flush=True)
                      try:
                          page.reload(wait_until="domcontentloaded", timeout=time_left_ms(30_000))
                      except PWTimeout:
                          page.goto(url, wait_until="domcontentloaded", timeout=time_left_ms(30_000))

              except Exception as e:
                  # Always try to capture what we saw
                  save_debug("error")
                  print("ERROR:", repr(e), flush=True)
                  raise
              finally:
                  browser.close()
          PY

      - name: Upload debug artifacts (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-wake-debug
          path: |
            debug_*.png
            debug_*.html
            debug_*_url.txt
          if-no-files-found: ignore