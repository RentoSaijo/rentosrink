name: Streamlit Keepalive

on:
  schedule:
    - cron: "17 */1 * * *" # every hour (UTC)
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Streamlit app (follow redirects; require final 200)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          BASE_URL="${APP_URL%/}/"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome Safari"

          echo "Base: $BASE_URL"

          # 3 quick attempts. Each attempt follows redirects and persists cookies.
          ok="0"
          for i in 1 2 3; do
            echo "---- attempt $i ----"

            # Show where the first hop wants to redirect (if any)
            echo "First-hop headers:"
            curl -q -sS --ipv4 -I \
              --connect-timeout 5 --max-time 10 \
              -A "$UA" \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
              "$BASE_URL" | sed -n 's/^HTTP\/.*//p;/^HTTP\|^Location:\|^Set-Cookie:/p'

            # Follow redirects, keep cookies, and capture final HTTP code + effective URL.
            rm -f cookies.txt body.html
            out="$(curl -q -sS --ipv4 \
              --connect-timeout 5 --max-time 20 \
              -A "$UA" \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
              -c cookies.txt -b cookies.txt \
              -L --max-redirs 10 \
              -o body.html \
              -w "code=%{http_code} effective=%{url_effective}\n" \
              "${BASE_URL}?keepalive=${i}&t=$(date +%s)" || true)"

            echo "$out"

            code="$(echo "$out" | sed -n 's/^code=\([0-9][0-9][0-9]\).*/\1/p')"

            # Only accept success if we ended up with a real 200 page fetch.
            if [ "$code" = "200" ]; then
              ok="1"
              break
            fi

            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "FAILED: never reached final HTTP 200 after redirects."
            echo "Saved body.html for inspection (first 60 lines):"
            sed -n '1,60p' body.html || true
            exit 1
          fi

          echo "OK: reached final HTTP 200."