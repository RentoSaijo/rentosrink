name: Streamlit Keepalive

on:
  schedule:
    - cron: "17 */1 * * *"  # every hour (UTC) at :17
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Streamlit app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          BASE_URL="${APP_URL%/}/"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome Safari"

          echo "Pinging: $BASE_URL"

          ok="0"
          for i in 1 2 3; do
            ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            code="$(curl -q -sS \
              --ipv4 \
              --connect-timeout 5 \
              --max-time 20 \
              -A "$UA" \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
              -o /dev/null -w "%{http_code}" \
              "${BASE_URL}?keepalive=${i}&t=$(date +%s)" || echo "000")"
            echo "$ts attempt=$i http=$code"

            # Count 2xx or 3xx as "traffic succeeded"
            if [ "${code#2}" != "$code" ] || [ "${code#3}" != "$code" ]; then
              ok="1"
              break
            fi

            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "No successful response (2xx/3xx) received."
            exit 1
          fi

          echo "OK: traffic recorded."